{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo paciente</title>

  <style>
    :root{
      --bg: #fbf7f1;
      --surface: #ffffff;
      --text: #3f3a33;
      --muted: #7a7064;
      --border: rgba(63,58,51,.10);
      --shadow: 0 12px 30px rgba(63,58,51,.08);
      --shadow-soft: 0 10px 22px rgba(63,58,51,.06);
      --primary: #c7b29a;
      --primary-strong: #b49a7d;
      --radius: 22px;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 10% 5%, #f3e8dc 0%, transparent 60%),
        radial-gradient(900px 600px at 90% 90%, #f0e4d6 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display:flex;
      justify-content:center;
    }

    .container{
      width: min(720px, 100%);
      display: grid;
      gap: 16px;
    }

    header h1{
      margin:0;
      font-size: 26px;
    }

    header p{
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .card{
      background: rgba(255,255,255,.88);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      padding: 22px;
    }

    form p{
      margin: 0 0 14px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-size: 13px;
      color: var(--muted);
    }

    input, textarea{
      width:100%;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.95);
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: .15s ease;
      box-shadow: 0 6px 14px rgba(63,58,51,.05);
    }

    textarea{
      min-height: 120px;
      resize: vertical;
    }

    input:focus, textarea:focus{
      border-color: rgba(180,154,125,.55);
      box-shadow: 0 0 0 4px rgba(199,178,154,.25);
    }

    .actions{
      margin-top: 10px;
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn{
      border: none;
      border-radius: 18px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s ease;
    }

    .btn-primary{
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
      color: #fff;
      box-shadow: 0 14px 26px rgba(180,154,125,.28);
    }

    .btn-primary:hover{
      transform: translateY(-1px);
    }

    .btn-ghost{
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover{
      background: rgba(246,239,230,.6);
      color: var(--text);
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>Novo paciente</h1>
      <p>Cadastre as informações principais para iniciar o acompanhamento.</p>
    </header>

    <section class="card">
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}

        <div class="actions">
          <button type="submit" class="btn btn-primary">
            Salvar paciente
          </button>
          <a href="javascript:history.back()" class="btn btn-ghost">
            Cancelar
          </a>
        </div>
      </form>
    </section>

  </main>
</body>
</html>
