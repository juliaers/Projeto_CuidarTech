{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar</title>

  <style>
    :root{
      --bg: #fbf7f1;
      --surface: #ffffff;
      --surface-2: #f6efe6;
      --text: #3f3a33;
      --muted: #7a7064;
      --border: rgba(63,58,51,.10);
      --shadow: 0 12px 30px rgba(63,58,51,.08);
      --shadow-soft: 0 10px 22px rgba(63,58,51,.06);
      --primary: #c7b29a;
      --primary-strong: #b49a7d;
      --radius: 22px;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 10% 5%, #f3e8dc 0%, transparent 60%),
        radial-gradient(900px 600px at 90% 90%, #f0e4d6 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px 16px;
    }

    .page{
      width: min(420px, 100%);
    }

    .card{
      background: rgba(255,255,255,.88);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      padding: 22px;
    }

    h1{
      margin: 0 0 6px;
      font-size: 26px;
      text-align: center;
    }

    .subtitle{
      margin: 0 0 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    form p{
      margin: 0 0 14px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-size: 13px;
      color: var(--muted);
    }

    input{
      width:100%;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.95);
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: .15s ease;
      box-shadow: 0 6px 14px rgba(63,58,51,.05);
    }

    input:focus{
      border-color: rgba(180,154,125,.55);
      box-shadow: 0 0 0 4px rgba(199,178,154,.25);
    }

    .actions{
      margin-top: 8px;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn{
      border: none;
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s ease;
    }

    .btn-primary{
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
      color: #fff;
      box-shadow: 0 14px 26px rgba(180,154,125,.28);
    }

    .btn-primary:hover{
      transform: translateY(-1px);
    }

    .signup-link{
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-top: 12px;
    }

    .signup-link a{
      color: var(--primary-strong);
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover{
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <h1>Entrar</h1>
      <p class="subtitle">
        Acesse sua conta para continuar.
      </p>

      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}

        <div class="actions">
          <button type="submit" class="btn btn-primary">
            Entrar
          </button>
        </div>
      </form>

      <p class="signup-link">
        Não tem conta?
        <a href="{% url 'cadastro' %}">Criar conta</a>
      </p>
    </section>
  </main>
</body>
</html>
